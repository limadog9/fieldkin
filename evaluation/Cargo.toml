[package]
name = "fieldkin-eval"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
publish = false
description = "Development-only reproducible evaluation of Fieldkin"
license = "MIT OR Apache-2.0"

[dependencies]
fieldkin = { path = ".." }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"
