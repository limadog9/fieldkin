name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform:
    name: ${{ matrix.os }} / Rust ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [1.85.0, 1.99.0]
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt --component clippy
      - run: cargo +${{ matrix.rust }} fmt --all -- --check
      - run: cargo +${{ matrix.rust }} fmt --manifest-path performance/Cargo.toml -- --check
      - run: cargo +${{ matrix.rust }} fmt --manifest-path qualification/Cargo.toml -- --check
      - run: cargo +${{ matrix.rust }} test --locked --all-features
      - run: cargo +${{ matrix.rust }} test --locked --manifest-path performance/Cargo.toml --all-features
      - run: cargo +${{ matrix.rust }} test --locked --manifest-path qualification/Cargo.toml
      - run: cargo +${{ matrix.rust }} clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo +${{ matrix.rust }} doc --locked --no-deps --all-features
      - run: cargo +${{ matrix.rust }} run --locked --example import_review
      - run: cargo +${{ matrix.rust }} run --locked --example catalog_review
      - run: cargo +${{ matrix.rust }} run --locked --example corroboration
      - run: cargo +${{ matrix.rust }} run --locked --example reviewed_import
      - run: cargo +${{ matrix.rust }} package --locked -p fieldkin
      - name: Verify original decisions with historical sample reliability
        run: cargo +${{ matrix.rust }} run --locked --release -p fieldkin-eval -- --check-behavior --output evaluation/results/baseline-v1
      - name: Verify current full development reports
        run: cargo +${{ matrix.rust }} run --locked --release -p fieldkin-eval -- --stage3 --check-behavior --output evaluation/results/rc-v1/stage3-development
      - name: Verify release development snapshot
        run: cargo +${{ matrix.rust }} run --locked --release -p fieldkin-eval -- --release --check-behavior --output evaluation/results/rc-v1/release
      - name: Verify corrective development and original regression (no fresh holdout)
        run: cargo +${{ matrix.rust }} run --locked --release -p fieldkin-eval -- --corrective --check --output evaluation/results/corrective-v1
      - name: Verify external annotation development (holdout remains reserved)
        run: cargo +${{ matrix.rust }} run --locked --release -p fieldkin-eval -- --external --check --output evaluation/results/t2d-v1
      - name: Reproduce external fixture from pinned annotations offline
        if: matrix.os == 'ubuntu-latest' && matrix.rust == '1.85.0'
        run: python3 evaluation/import_t2d.py --check
      - name: Validate external importer invariants
        if: matrix.os == 'ubuntu-latest' && matrix.rust == '1.85.0'
        run: python3 -m unittest discover -s evaluation -p test_import_t2d.py
  test:
    name: test
    needs: platform
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform and compiler check
        env:
          PLATFORM_RESULT: ${{ needs.platform.result }}
        run: test "$PLATFORM_RESULT" = success
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt
      - run: cargo +1.85.0 fmt --all -- --check
      - run: cargo +1.85.0 fmt --manifest-path performance/Cargo.toml -- --check
      - run: cargo +1.85.0 fmt --manifest-path qualification/Cargo.toml -- --check
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.85.0 --profile minimal --component clippy
      - run: cargo +1.85.0 clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo +1.85.0 clippy --locked --manifest-path performance/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo +1.85.0 clippy --locked --manifest-path qualification/Cargo.toml --all-targets -- -D warnings
  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.85.0 --profile minimal
      - run: cargo +1.85.0 doc --locked --no-deps --all-features
      - run: cargo +1.85.0 test --locked --doc
