name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform:
    name: ${{ matrix.os }} / stable Rust
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup update stable --no-self-update
      - run: rustup component add rustfmt clippy --toolchain stable
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path performance/Cargo.toml -- --check
      - run: cargo fmt --manifest-path qualification/Cargo.toml -- --check
      - run: cargo test --locked --workspace --all-features
      - run: cargo test --locked -p fieldkin --no-default-features
      - run: cargo test --locked -p fieldkin --example scale_cost
      - run: cargo test --locked --manifest-path performance/Cargo.toml --all-features
      - run: cargo test --locked --manifest-path qualification/Cargo.toml
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --locked --manifest-path performance/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo clippy --locked --manifest-path qualification/Cargo.toml --all-targets -- -D warnings
      - run: cargo doc --locked --no-deps --all-features
      - run: cargo run --locked --example import_review
      - run: cargo run --locked --example catalog_review
      - run: cargo run --locked --example corroboration
      - run: cargo run --locked --example contextual_quality
      - run: cargo run --locked --example reviewed_import
      - run: cargo run --locked --features json --example persisted_review
      - run: cargo run --locked --example assignment_compatibility -- --check-only
      - run: cargo package --locked -p fieldkin
      - run: cargo package --locked -p fieldkin --features json
      - run: cargo publish --locked -p fieldkin --dry-run --no-default-features
      - run: cargo publish --locked -p fieldkin --dry-run --no-default-features --features json
      - name: Verify original development snapshots with native tooling provenance
        run: cargo run --locked --release -p fieldkin-eval -- --check --output evaluation/results/quality-pass-v1/current/baseline
      - name: Verify complete Stage3 development reports
        run: cargo run --locked --release -p fieldkin-eval -- --stage3 --check --output evaluation/results/quality-pass-v1/current/stage3
      - name: Verify release development reports
        run: cargo run --locked --release -p fieldkin-eval -- --release --check --output evaluation/results/quality-pass-v1/current/release
      - name: Verify corrective development and retired original regression
        run: cargo run --locked --release -p fieldkin-eval -- --corrective --check --output evaluation/results/quality-pass-v1/current/corrective
      - name: Verify conflict and abstention precision against the unchanged baseline
        run: cargo run --locked --release -p fieldkin-eval -- --precision --check --output evaluation/results/quality-pass-v1/current/precision
      - name: Verify development candidate precision and useful coverage
        run: cargo run --locked --release -p fieldkin-eval -- --readiness --check --output evaluation/results/quality-pass-v1/current/readiness
      - name: Verify same-input regression including examined qualification
        run: cargo run --locked --release -p fieldkin-eval -- --readiness-regression --before evaluation/results/quality-pass-v1/before --check --output evaluation/results/quality-pass-v1/current/readiness-regression
      - name: Verify external annotation development
        run: cargo run --locked --release -p fieldkin-eval -- --external --check --output evaluation/results/quality-pass-v1/current/external
      - name: Verify archived external scores with native matching
        run: cargo run --locked --release -p fieldkin-eval -- --northix --check --scores evaluation/results/continuation-v1/valentine/valentine-schema_only.json --scores evaluation/results/continuation-v1/valentine/valentine-schema_and_samples.json --output evaluation/results/quality-pass-v1/current/northix
      - name: Reproduce licensed fixture archives offline in Rust
        run: cargo run --locked -p fieldkin-tools -- import-northix --check
      - run: cargo run --locked -p fieldkin-tools -- import-t2d --check
      - name: Build a separately recorded native evaluator
        run: cargo run --locked -p fieldkin-tools -- verify-build --build-dir target/verified-external --toolchain stable
      - name: Run verified development evaluation with source and binary guards
        run: cargo run --locked -p fieldkin-tools -- verify-run --build-dir target/verified-external --output target/verified-external-results
      - name: Exercise generated invariants without reading reserved fixtures
        run: cargo run --locked --release --manifest-path qualification/Cargo.toml -- --cases 5000 --seed 20261003
  development-quality:
    name: development quality acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup update stable --no-self-update
      - name: Reproduce the documented public candidate on development only
        run: cargo run --locked --release -p fieldkin-eval -- --readiness-regression --policies default,name_only_070,name_only_exact,contextual,contextual_quality --check --output evaluation/results/quality-pass-v1/development-native/artifacts
      - name: Build a fresh evaluator bound to this checkout
        run: cargo run --locked -p fieldkin-tools -- verify-build --build-dir target/development-quality --toolchain stable
      - name: Record guarded development evidence without consuming a holdout
        run: cargo run --locked -p fieldkin-tools -- record-quality-development --build-dir target/development-quality --output target/development-quality-results
      - name: Require numerical quality separately from snapshot equality
        run: cargo run --locked -p fieldkin-tools -- development-acceptance --development target/development-quality-results/artifacts
  test:
    name: test
    needs: platform
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform check
        env:
          PLATFORM_RESULT: ${{ needs.platform.result }}
        run: test "$PLATFORM_RESULT" = success
  format:
    name: format
    needs: platform
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          PLATFORM_RESULT: ${{ needs.platform.result }}
        run: test "$PLATFORM_RESULT" = success
  clippy:
    name: clippy
    needs: platform
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          PLATFORM_RESULT: ${{ needs.platform.result }}
        run: test "$PLATFORM_RESULT" = success
  docs:
    name: docs
    needs: platform
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          PLATFORM_RESULT: ${{ needs.platform.result }}
        run: test "$PLATFORM_RESULT" = success
