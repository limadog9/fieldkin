name: Release validation

# Manual pre-release verification, not an enforced publishing gate. There is no
# automated publication workflow; maintainers must require this run before release.
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_BUILD_JOBS: 1
  PYTHONHASHSEED: 0
  OPENBLAS_NUM_THREADS: 1
  OMP_NUM_THREADS: 1

jobs:
  live-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - name: Prepare pinned reference, dependencies and corpora
        env:
          VALENTINE_REVISION: d8fa9ee6d312b49ce2c45b62824df1fd31b94a72
          NLTK_REVISION: 550b6625bcef1f2abff2ff770a5a0d272c9c6b2a
        run: |
          mkdir -p target/release-validation .upstream/nltk_data
          {
            git rev-parse HEAD
            rustc -Vv
            cargo -V
            python -VV
            python -m pip install --target .upstream/python --no-deps --require-hashes --only-binary=:all: -r validation/release-requirements.txt
            PYTHONPATH=.upstream/python python -m pip check
            python -m pip freeze --path .upstream/python
            PYTHONPATH=.upstream/python python -c 'import hashlib, pathlib, pulp, subprocess; solver = pulp.PULP_CBC_CMD(); print("PuLP", pulp.__version__, "CBC SHA256", hashlib.sha256(pathlib.Path(solver.path).read_bytes()).hexdigest()); subprocess.run([solver.path, "-stop"], check=True)'
            git init .upstream/valentine
            git -C .upstream/valentine remote add origin https://github.com/delftdata/valentine
            git -C .upstream/valentine fetch --depth 1 origin "$VALENTINE_REVISION"
            git -C .upstream/valentine checkout --detach FETCH_HEAD
            while read -r checksum path; do
              mkdir -p ".upstream/nltk_data/$(dirname "$path")"
              curl --fail --location --retry 3 "https://raw.githubusercontent.com/nltk/nltk_data/$NLTK_REVISION/packages/$path" -o ".upstream/nltk_data/$path"
            done < validation/release-nltk.sha256
            (cd .upstream/nltk_data && sha256sum -c ../../validation/release-nltk.sha256)
            python -m zipfile -e .upstream/nltk_data/corpora/stopwords.zip .upstream/nltk_data/corpora
            python -m zipfile -e .upstream/nltk_data/tokenizers/punkt_tab.zip .upstream/nltk_data/tokenizers
          } 2>&1 | tee target/release-validation/setup.log
      - name: Run native reference inputs
        run: cargo run --locked --release --example valentine_parity -- target/release-validation/rust.json 2>&1 | tee target/release-validation/rust.log
      - name: Compare corrected reference strictly
        run: |
          python scripts/run_valentine_parity.py --reference-fixes --output target/release-validation/python-fixed.json 2>&1 | tee target/release-validation/python-fixed.log
          python scripts/compare_valentine_parity.py --require-reference-fixes --rust target/release-validation/rust.json --python target/release-validation/python-fixed.json --output target/release-validation/comparison-fixed.json 2>&1 | tee target/release-validation/comparison-fixed.log
          python scripts/test_distribution_reference_patch.py 2>&1 | tee target/release-validation/distribution-patch.log
          REFERENCE=$(python -c 'import json; print(json.load(open("target/release-validation/python-fixed.json"))["reference"]["source_root"])')
          python scripts/test_cupid_reference_fix.py --reference-dir "$REFERENCE" 2>&1 | tee target/release-validation/cupid-patch.log
      - name: Diagnose unmodified upstream separately
        # Run even after a corrected-reference failure, without hiding that failure.
        if: ${{ !cancelled() && hashFiles('target/release-validation/rust.json') != '' }}
        run: |
          python scripts/run_valentine_parity.py --output target/release-validation/python-upstream.json 2>&1 | tee target/release-validation/python-upstream.log
          python scripts/compare_valentine_parity.py --upstream-diagnostic --rust target/release-validation/rust.json --python target/release-validation/python-upstream.json --output target/release-validation/comparison-upstream.json 2>&1 | tee target/release-validation/comparison-upstream.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-reference-${{ github.sha }}
          path: target/release-validation/
          if-no-files-found: error
          retention-days: 30

  native-minilm:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # A complete pinned cache makes hf-hub read local files instead of resolving main.
      HF_HOME: ${{ github.workspace }}/target/release-model
      MODEL_REVISION: d13954661f83248295ba75c1ed411eef3b7b936e
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - name: Download and verify pinned MiniLM files
        run: |
          mkdir -p target/release-validation
          {
            git rev-parse HEAD
            rustc -Vv
            MODEL_REPO="$HF_HOME/models--Qdrant--all-MiniLM-L6-v2-onnx"
            MODEL_DIR="$MODEL_REPO/snapshots/$MODEL_REVISION"
            mkdir -p "$MODEL_DIR" "$MODEL_REPO/refs"
            while read -r checksum file; do
              curl --fail --location --retry 3 "https://huggingface.co/Qdrant/all-MiniLM-L6-v2-onnx/resolve/$MODEL_REVISION/$file" -o "$MODEL_DIR/$file"
            done < validation/release-model.sha256
            (cd "$MODEL_DIR" && sha256sum -c "$GITHUB_WORKSPACE/validation/release-model.sha256")
            printf %s "$MODEL_REVISION" > "$MODEL_REPO/refs/main"
          } 2>&1 | tee target/release-validation/model-setup.log
      - name: Execute real native ONNX integration test
        run: |
          cargo test --locked --features embeddings --lib embeddings::tests::real_minilm_model_encodes_and_matches_related_values -- --ignored --exact --nocapture 2>&1 | tee target/release-validation/native-minilm.log
          # A renamed/removed test must not silently turn this into a zero-test pass.
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' target/release-validation/native-minilm.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-minilm-${{ github.sha }}
          path: target/release-validation/
          if-no-files-found: error
          retention-days: 30

  packaged-consumer:
    strategy:
      fail-fast: false
      matrix:
        rust: ['1.94.0', stable]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - name: Verify packaged downstream consumption with fresh resolution
        run: |
          mkdir -p target/release-validation
          {
            git rev-parse HEAD
            rustc -Vv
            cargo -V
            python -VV
            cargo package --locked
            FIELDKIN_PACKAGE_ARCHIVE=$(cargo metadata --locked --no-deps --format-version 1 | python -c 'import json, pathlib, sys; metadata = json.load(sys.stdin); package = metadata["packages"][0]; print(pathlib.Path(metadata["target_directory"]) / "package" / "{}-{}.crate".format(package["name"], package["version"]))')
            python scripts/check_packaged_consumer.py "$FIELDKIN_PACKAGE_ARCHIVE"
          } 2>&1 | tee target/release-validation/packaged-consumer.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-consumer-${{ matrix.rust }}-${{ github.sha }}
          path: target/release-validation/
          if-no-files-found: error
          retention-days: 30
