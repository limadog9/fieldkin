name: Rust
env:
  CARGO_BUILD_JOBS: 1
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - name: Check suggestion quality against frozen ground truth
        run: cargo run --locked --example evaluate_all -- --check
      - name: Measure independent Valentine accuracy (separate from parity)
        run: cargo run --locked --example benchmark_accuracy -- --independent
      - run: cargo test --locked --all-targets --all-features
      - run: cargo test --locked --doc
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo package --locked
