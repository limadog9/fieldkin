name: Rust
env:
  CARGO_BUILD_JOBS: 1
defaults:
  run:
    shell: bash
on:
  workflow_call:
  push:
  pull_request:
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
  minimum-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo check --locked --all-targets --all-features --jobs 1
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test parity and benchmark validation helpers
        run: |
          python scripts/test_compare_valentine_parity.py
          python scripts/test_distribution_solver_diagnostic.py
          python scripts/test_release_evidence.py
          python validation/test_benchmark_valentine.py
          python validation/test_benchmark_performance.py
      - name: Check suggestion quality against frozen ground truth
        run: cargo run --locked --example evaluate_all -- --check
      - name: Check independent accuracy against frozen quality baselines
        run: |
          cargo run --locked --example benchmark_accuracy -- --independent --check
          cargo run --locked --example evaluate_all -- --check-independent
      - name: Verify frozen reliability extraction
        if: runner.os == 'Linux'
        run: |
          python validation/reliability/verify_extraction.py --self-test
          python validation/reliability/verify_extraction.py
      - name: Check reliability against the original-runtime baseline
        run: cargo run --locked --example evaluate_all -- --check-reliability
      - name: Check newly sourced semantic cases against the original runtime
        run: cargo run --locked --example evaluate_all -- --check-semantic
      - run: cargo test --locked --all-targets --all-features
      - name: Test documented default features
        run: cargo test --locked
      - run: cargo test --locked --doc
      - run: cargo package --locked
  # Keep the required status independent of matrix labels and require both OSes
  # and the documented minimum compiler.
  test:
    needs: [tests, minimum-rust]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform test to pass
        env:
          TEST_RESULT: ${{ needs.tests.result }}
          MINIMUM_RUST_RESULT: ${{ needs.minimum-rust.result }}
        run: test "$TEST_RESULT" = success && test "$MINIMUM_RUST_RESULT" = success
