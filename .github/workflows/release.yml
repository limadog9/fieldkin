name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to crates.io and attach evidence to a GitHub release (requires configured authorization)'
        type: boolean
        default: false
      tag:
        description: 'Existing vVERSION tag at this exact commit; required only for publication'
        type: string
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_BUILD_JOBS: 1

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Resolve immutable source, version and optional existing tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          PUBLISH: ${{ inputs.publish }}
        run: python scripts/release_evidence.py preflight --sha "$GITHUB_SHA" --tag "$RELEASE_TAG" --publish "$PUBLISH" --output target/release-preflight.json

  ordinary-ci:
    needs: preflight
    uses: ./.github/workflows/rust.yml

  release-validation:
    needs: preflight
    uses: ./.github/workflows/release-validation.yml

  evidence:
    needs: [preflight, ordinary-ci, release-validation]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-${{ github.sha }}'
          path: target/release-inputs
      - name: Require complete successful evidence from this source and workflow run
        env:
          REQUIRED_JOBS: ${{ toJSON(needs) }}
          RELEASE_TAG: ${{ inputs.tag }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          python scripts/release_evidence.py collect --sha "$GITHUB_SHA" --tag "$RELEASE_TAG" --publish "$PUBLISH" --jobs "$REQUIRED_JOBS" --inputs target/release-inputs --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --output target/release-evidence/release-evidence.json
          cp target/release-inputs/validated-package-"$GITHUB_SHA"/package.json target/release-evidence/
          cp target/release-inputs/validated-package-"$GITHUB_SHA"/*.crate target/release-evidence/
      - name: Rehearse Cargo publication and verify the repackaged artifact
        run: |
          TOOLCHAIN=$(python -c 'import json; print(json.load(open("target/release-evidence/package.json"))["rustc"].splitlines()[0].split()[1])')
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup override set "$TOOLCHAIN"
          cargo publish --locked --dry-run
          VERSION=$(python -c 'import json; print(json.load(open("target/release-evidence/package.json"))["version"])')
          python scripts/release_evidence.py check-package --sha "$GITHUB_SHA" --archive "target/package/fieldkin-$VERSION.crate" --expected target/release-evidence/package.json --output target/release-evidence/dry-run-package.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence-${{ github.sha }}
          path: target/release-evidence/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: evidence
    if: inputs.publish && needs.evidence.result == 'success'
    environment: crates-io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - uses: actions/download-artifact@v4
        with:
          name: release-evidence-${{ github.sha }}
          path: target/release-evidence
      - name: Install the exact compiler that produced the tested package
        run: |
          TOOLCHAIN=$(python -c 'import json; print(json.load(open("target/release-evidence/package.json"))["rustc"].splitlines()[0].split()[1])')
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup override set "$TOOLCHAIN"
      - name: Recheck source and verify publication dry-run repackaging
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python scripts/release_evidence.py preflight --sha "$GITHUB_SHA" --tag "$RELEASE_TAG" --publish true --output target/release-evidence/publication-preflight.json
          cargo publish --locked --dry-run
          VERSION=$(python -c 'import json; print(json.load(open("target/release-evidence/package.json"))["version"])')
          python scripts/release_evidence.py check-package --sha "$GITHUB_SHA" --archive "target/package/fieldkin-$VERSION.crate" --expected target/release-evidence/package.json --output target/release-evidence/repackaging.json
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: registry-auth
      - name: Publish with Cargo, then verify the uploaded archive checksum
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.registry-auth.outputs.token }}
        run: |
          cargo publish --locked
          VERSION=$(python -c 'import json; print(json.load(open("target/release-evidence/package.json"))["version"])')
          python scripts/release_evidence.py check-package --sha "$GITHUB_SHA" --archive "target/package/fieldkin-$VERSION.crate" --expected target/release-evidence/package.json --output target/release-evidence/publication-package.json
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 5 "https://static.crates.io/crates/fieldkin/fieldkin-$VERSION.crate" -o target/release-evidence/registry.crate
          python scripts/release_evidence.py check-package --sha "$GITHUB_SHA" --archive target/release-evidence/registry.crate --expected target/release-evidence/package.json --output target/release-evidence/registry-package.json
      - name: Retain compact evidence with the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes 'Release validation and package correspondence are recorded in the attached evidence.'
          fi
          gh release upload "$RELEASE_TAG" target/release-evidence/*.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-evidence-${{ github.sha }}
          path: target/release-evidence/*.json
          if-no-files-found: error
          retention-days: 30
