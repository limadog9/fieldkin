[package]
name = "fieldkin-performance"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
license = "MIT OR Apache-2.0"

# Deliberately isolated: instrumentation is not a library or normal timing dependency.
[workspace]

[dependencies]
fieldkin = { path = ".." }
stats_alloc = { version = "=0.1.10", optional = true }

[features]
allocations = ["dep:stats_alloc"]

[lints.rust]
unsafe_code = "forbid"
