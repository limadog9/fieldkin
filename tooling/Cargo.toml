[package]
name = "fieldkin-tools"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
publish = false
description = "Native Rust fixture, qualification and measurement tooling for Fieldkin"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
csv = "1.3"
flate2 = "1.0"
tar = "0.4"
zip = { version = "=6.0.0", default-features = false, features = ["deflate-flate2"] }
toml = "0.8"

[lints.rust]
unsafe_code = "forbid"
